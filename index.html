<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera Selfie SIPADU</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    video, canvas, img {
      width: 100%;
      border-radius: 12px;
      margin-top: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      font-size: 16px;
    }

    #pesan {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>KAMERA SELFIE SIPADU</h2>
  <p>Ambil foto untuk presensi guru dan tenaga kependidikan.</p>

  <video id="video" autoplay playsinline muted></video>

  <canvas id="canvas" style="display:none"></canvas>

  <img id="preview" style="display:none">

  <button onclick="bukaKamera()">AKTIFKAN KAMERA</button>
  <button onclick="ambilFoto()">AMBIL SELFIE</button>
  <button onclick="ulangFoto()">ULANGI FOTO</button>

  <p id="pesan">Silakan aktifkan kamera.</p>
</div>

<script>
let stream = null;

async function bukaKamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    const video = document.getElementById("video");
    video.srcObject = stream;
    await video.play();

    document.getElementById("pesan").innerText =
      "Kamera berhasil diaktifkan.";

  } catch (error) {
    document.getElementById("pesan").innerText =
      "Kamera gagal dibuka: " + error.name + " - " + error.message;
  }
}

function ambilFoto() {
  const video = document.getElementById("video");

  if (!stream || !video.videoWidth) {
    document.getElementById("pesan").innerText =
      "Aktifkan kamera terlebih dahulu.";
    return;
  }

  const canvas = document.getElementById("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  canvas.getContext("2d").drawImage(
    video, 0, 0, canvas.width, canvas.height
  );

  document.getElementById("preview").src =
    canvas.toDataURL("image/jpeg", 0.8);

  document.getElementById("preview").style.display = "block";
  video.style.display = "none";

  hentikanKamera();

  document.getElementById("pesan").innerText =
    "Foto selfie berhasil diambil.";
}

function ulangFoto() {
  document.getElementById("preview").style.display = "none";
  document.getElementById("video").style.display = "block";
  bukaKamera();
}

function hentikanKamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
}
</script>

</body>
</html>
